<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Shooter - Juego Phaser</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #111428 0%, #05060d 100%);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.4rem;
      color: #4df0ff;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(77, 240, 255, 0.7);
    }

    .author-badge {
      display: inline-block;
      margin-top: 4px;
      padding: 3px 12px;
      background: rgba(77, 240, 255, 0.15);
      border: 1px solid #4df0ff;
      border-radius: 14px;
      font-size: 0.85rem;
      color: #e0f8ff;
    }

    #bloque_juego {
      border: 3px solid #2a4175;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(34, 114, 255, 0.5);
      overflow: hidden;
      background-color: #0c0c20;
    }

    .instructions {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #94a3b8;
      text-align: center;
    }

    .instructions kbd {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 2px 6px;
      color: #38bdf8;
      font-family: monospace;
    }
  </style>
  <script src="phaser.js"></script>
</head>

<body>
  <header>
    <h1>Galaxy Defender JS</h1>
    <div class="author-badge">Estudiante: <strong>Andre Alvarado Lira</strong></div>
  </header>

  <div id="bloque_juego"></div>

  <div class="instructions">
    Controles: <kbd>&larr;</kbd> <kbd>&rarr;</kbd> Moverse | <kbd>ESPACIO</kbd> Disparar / Iniciar
  </div>

  <script src="script.js"></script>
</body>

</html>
